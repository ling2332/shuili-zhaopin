<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>水利招聘汇总</title>
<meta name="description" content="流域机构、水利设计院、水利水电央国企、科研院所的招聘公告汇总，每天更新，按单位类型和地区筛选。">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16262B; --muted:#5A6B70; --faint:#8A989C; --line:#DCE3E2;
  --accent:#0F6E78; --accent-soft:#E2F0F1; --warn:#9A5B0B;
  --c1:#0F6E78; --c2:#3B5BA5; --c3:#7A4FA0; --c4:#A0522D; --c5:#4D7C2F; --c6:#8A6A12; --c7:#6B6B6B; --c8:#A13D63;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F181B; --surface:#152227; --ink:#E2EAEB; --muted:#9AABAF; --faint:#6F8287; --line:#25363C;
    --accent:#4FB8C2; --accent-soft:#17343A; --warn:#E0A54A;
    --c1:#4FB8C2; --c2:#86A2E6; --c3:#B993DB; --c4:#E0956B; --c5:#8FC26A; --c6:#D9B657; --c7:#A8A8A8; --c8:#E07FA4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F181B; --surface:#152227; --ink:#E2EAEB; --muted:#9AABAF; --faint:#6F8287; --line:#25363C;
  --accent:#4FB8C2; --accent-soft:#17343A; --warn:#E0A54A;
  --c1:#4FB8C2; --c2:#86A2E6; --c3:#B993DB; --c4:#E0956B; --c5:#8FC26A; --c6:#D9B657; --c7:#A8A8A8; --c8:#E07FA4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{padding:28px 0 12px}
h1{margin:0;font-size:26px;letter-spacing:.02em;font-weight:700}
.lede{margin:6px 0 0;color:var(--muted);font-size:14px}
.meta{margin:10px 0 0;color:var(--faint);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.meta b{color:var(--ink);font-weight:600}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--ink)}
.search input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{opacity:.65;margin-left:3px;font-variant-numeric:tabular-nums}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:6px}
select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:5px 10px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.count{margin-left:auto;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}

main{padding:4px 0 24px}
.day{margin:18px 0 6px;font-size:13px;color:var(--faint);display:flex;gap:8px;align-items:baseline}
.day b{color:var(--ink);font-size:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:6px 0}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.org{font-weight:650;font-size:16px;text-decoration:none}
.org:hover{text-decoration:underline;text-underline-offset:3px}
.tag{font-size:12px;line-height:1;padding:4px 7px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.kind{font-size:12px;color:var(--muted)}
.title{margin:3px 0 0;color:var(--muted);font-size:13.5px;text-decoration:none;display:block}
.title:hover{color:var(--ink)}
.sub{margin-top:5px;font-size:12.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:2px 12px}
.sub .w{color:var(--accent)}
details.more{margin-top:4px;font-size:12.5px;color:var(--faint)}
details.more summary{cursor:pointer}
details.more a{color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.empty button{font:inherit;margin-top:8px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}

footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted);font-size:13px}
footer h2{font-size:14px;margin:0 0 6px;color:var(--ink)}
footer ul{margin:0 0 12px;padding-left:18px}
footer p{margin:6px 0}
@media (max-width:520px){
  h1{font-size:22px}
  .count{width:100%;margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>水利招聘汇总</h1>
    <p class="lede">流域机构、水利设计院、水利水电央国企、科研院所的招聘公告，从多个渠道汇到一处，点进去看原文。</p>
    <p class="meta" id="meta"></p>
  </header>

  <div class="bar" role="search">
    <div class="search">
      <input id="q" type="search" placeholder="搜单位或关键词，如 长江委、设计院、湖北" aria-label="搜索">
    </div>
    <div class="chips" id="cats" role="group" aria-label="单位类型"></div>
    <div class="row2">
      <select id="reg" aria-label="地区"></select>
      <select id="kind" aria-label="招聘性质"></select>
      <div class="seg" id="range" role="group" aria-label="发布时间">
        <button data-v="7">近7天</button><button data-v="30">近30天</button><button data-v="0">全部</button>
      </div>
      <label class="toggle" title="取消勾选可看全部单位，包括综合类央企、民企"><input type="checkbox" id="water"> 只看涉水单位</label>
      <span class="count" id="count"></span>
    </div>
  </div>

  <main id="list" aria-live="polite"></main>

  <footer>
    <h2>数据来源</h2>
    <ul id="srcs"></ul>
    <p>宣讲会、双选会按举办日期排列，所以列表顶上可能是未来几天的场次。</p>
    <p>本页只汇总公告标题和原文链接，报名时间、岗位和条件以原文为准。单位类型、地区由程序按名称自动判断，可能有误。</p>
    <p>默认只显示涉水单位（流域机构、水利水电设计院、水务、港航等），取消勾选"只看涉水单位"可看全部，包括综合类央企和民企。同一单位同一类招聘在 45 天内的多条推送合并为一条，其余链接收在"另有相关推送"里。</p>
  </footer>
</div>

<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var CATS = ['机关与流域机构','科研院所','勘测设计院','央企','地方国企','地方事业单位','高校','其他企业'];
  var CCOL = {'机关与流域机构':'--c1','科研院所':'--c3','勘测设计院':'--c2','央企':'--c4','地方国企':'--c5','地方事业单位':'--c6','高校':'--c8','其他企业':'--c7'};
  var KINDS = ['事业编','校招','社招','实习','宣讲会','公务员','招聘'];
  var WEEK = '日一二三四五六';
  var today = new Date(); today.setHours(0,0,0,0);
  var DEF = {q:'', cat:'', reg:'', kind:'', range:'30', water:true};
  var S = Object.assign({}, DEF);

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function age(d){ var p=d.split('-'); return Math.round((today - new Date(+p[0], p[1]-1, +p[2])) / 864e5); }

  // 筛选条件写进地址栏 #，转发链接时别人看到的是同一个筛选结果
  function readHash(){
    var h = decodeURIComponent(location.hash.slice(1));
    h.split('&').forEach(function(kv){
      var i = kv.indexOf('='); if (i < 0) return;
      var k = kv.slice(0,i), v = kv.slice(i+1);
      if (k in S) S[k] = (k === 'water') ? v !== '0' : v;
    });
  }
  function writeHash(){
    var parts = [];
    ['q','cat','reg','kind'].forEach(function(k){ if (S[k]) parts.push(k + '=' + S[k]); });
    if (S.range !== '30') parts.push('range=' + S.range);
    if (!S.water) parts.push('water=0');
    history.replaceState(null, '', parts.length ? '#' + encodeURIComponent(parts.join('&')) : location.pathname + location.search);
  }

  function match(it, skip){
    if (skip !== 'range' && S.range !== '0' && age(it.d) > +S.range) return false;
    if (skip !== 'water' && S.water && !it.w) return false;
    if (skip !== 'cat' && S.cat && it.cat !== S.cat) return false;
    if (skip !== 'reg' && S.reg && it.reg !== S.reg) return false;
    if (skip !== 'kind' && S.kind && it.kind !== S.kind) return false;
    if (S.q){
      var hay = (it.org + ' ' + it.t + ' ' + it.reg + ' ' + it.cat + ' ' + it.kind + ' ' + it.s).toLowerCase();
      var ok = S.q.toLowerCase().split(/\s+/).every(function(w){ return !w || hay.indexOf(w) >= 0; });
      if (!ok) return false;
    }
    return true;
  }
  function countBy(field, skip){
    var c = {};
    D.items.forEach(function(it){ if (match(it, skip)) c[it[field]] = (c[it[field]] || 0) + 1; });
    return c;
  }

  function renderControls(){
    var cc = countBy('cat', 'cat'), total = 0;
    CATS.forEach(function(k){ total += cc[k] || 0; });
    var html = '<button class="chip" data-v="" aria-pressed="' + (!S.cat) + '">全部<span class="n">' + total + '</span></button>';
    CATS.forEach(function(k){
      if (!cc[k] && S.cat !== k) return;
      html += '<button class="chip" data-v="' + esc(k) + '" aria-pressed="' + (S.cat === k) + '">' + esc(k) + '<span class="n">' + (cc[k] || 0) + '</span></button>';
    });
    $('cats').innerHTML = html;

    var rc = countBy('reg', 'reg');
    var regs = Object.keys(rc).filter(Boolean).sort(function(a,b){ return (a === '全国') ? -1 : (b === '全国') ? 1 : rc[b] - rc[a]; });
    if (S.reg && regs.indexOf(S.reg) < 0) regs.unshift(S.reg);
    $('reg').innerHTML = '<option value="">全部地区</option>' + regs.map(function(r){
      return '<option value="' + esc(r) + '"' + (S.reg === r ? ' selected' : '') + '>' + esc(r) + '（' + (rc[r] || 0) + '）</option>';
    }).join('');

    var kc = countBy('kind', 'kind');
    $('kind').innerHTML = '<option value="">全部性质</option>' + KINDS.filter(function(k){ return kc[k] || S.kind === k; }).map(function(k){
      return '<option value="' + k + '"' + (S.kind === k ? ' selected' : '') + '>' + k + '（' + (kc[k] || 0) + '）</option>';
    }).join('');

    Array.prototype.forEach.call($('range').children, function(b){ b.setAttribute('aria-pressed', b.dataset.v === S.range); });
    $('water').checked = S.water;
    if ($('q').value !== S.q) $('q').value = S.q;
  }

  function dayLabel(d){
    var p = d.split('-'), dt = new Date(+p[0], p[1]-1, +p[2]), a = age(d);
    var rel = a === 0 ? '今天' : a === 1 ? '昨天' : a === -1 ? '明天' : a < 0 ? (-a) + ' 天后 · 周' + WEEK[dt.getDay()] : '周' + WEEK[dt.getDay()];
    return '<b>' + (+p[1]) + '月' + (+p[2]) + '日</b><span>' + rel + (+p[0] !== today.getFullYear() ? ' · ' + p[0] : '') + '</span>';
  }

  function renderList(){
    var rows = D.items.filter(function(it){ return match(it); });
    $('count').textContent = '共 ' + rows.length + ' 条';
    if (!rows.length){
      $('list').innerHTML = '<div class="empty">没有符合条件的公告。<br><button id="reset">清空筛选</button></div>';
      $('reset').onclick = function(){ S = Object.assign({}, DEF, {range:'0', water:false}); update(); };
      return;
    }
    var html = '', last = '', n = {};
    rows.forEach(function(it){ n[it.d] = (n[it.d] || 0) + 1; });
    rows.forEach(function(it){
      if (it.d !== last){ html += '<h2 class="day">' + dayLabel(it.d) + '<span>' + n[it.d] + ' 条</span></h2>'; last = it.d; }
      var col = 'var(' + (CCOL[it.cat] || '--c7') + ')';
      html += '<article class="item"><div class="top">' +
        '<a class="org" href="' + esc(it.u) + '" target="_blank" rel="noopener">' + esc(it.org) + '</a>' +
        '<span class="tag" style="color:' + col + '">' + esc(it.cat) + '</span>' +
        '<span class="kind">' + esc(it.kind) + (it.co ? ' · ' + it.co + '届' : '') + '</span></div>' +
        '<a class="title" href="' + esc(it.u) + '" target="_blank" rel="noopener">' + esc(it.t) + '</a>' +
        '<div class="sub">' + (it.reg ? '<span>' + esc(it.reg) + '</span>' : '') +
        (it.w ? '<span class="w">涉水</span>' : '') + '<span>来源：' + esc(it.s) + '</span></div>';
      if (it.more && it.more.length){
        html += '<details class="more"><summary>另有 ' + it.more.length + ' 条相关推送</summary>' +
          it.more.map(function(m){ return '<div>' + m.d + ' · <a href="' + esc(m.u) + '" target="_blank" rel="noopener">' + esc(m.s) + '</a></div>'; }).join('') +
          '</details>';
      }
      html += '</article>';
    });
    $('list').innerHTML = html;
  }

  function update(){ renderControls(); renderList(); writeHash(); }

  $('cats').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if (b){ S.cat = b.dataset.v; update(); } });
  $('range').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b){ S.range = b.dataset.v; update(); } });
  $('reg').onchange = function(){ S.reg = this.value; update(); };
  $('kind').onchange = function(){ S.kind = this.value; update(); };
  $('water').onchange = function(){ S.water = this.checked; update(); };
  var t; $('q').addEventListener('input', function(){ var v = this.value.trim(); clearTimeout(t); t = setTimeout(function(){ S.q = v; update(); }, 150); });

  var recent = D.items.filter(function(it){ var a = age(it.d); return a >= 0 && a <= 7; }).length;
  $('meta').innerHTML = '<span>更新于 <b>' + esc(D.updated) + '</b></span><span>收录 <b>' + D.items.length + '</b> 条</span>' +
    '<span>近 7 天新增 <b>' + recent + '</b> 条</span><span>来源 <b>' + D.sources.length + '</b> 个</span>';
  $('srcs').innerHTML = D.sources.map(function(s){
    return '<li>' + (s.home ? '<a href="' + esc(s.home) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a>' : esc(s.name)) + '</li>';
  }).join('');

  readHash();
  update();
})();
</script>
</body>
</html>
